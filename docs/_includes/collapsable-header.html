<a
  class="collapsable-header collapsed {{ include.class }} text-reset link-underline link-underline-opacity-0 d-flex flex-row justify-content-between align-items-center"
  data-bs-toggle="collapse"
  href="#{{ include.id }}"
  role="button"
  aria-expanded="false"
  aria-controls="{{ include.id }}"
>
  <span>{{ include.title }}</span>
  <div class="d-inline-block d-sm-none">
    <i class="bi bi-plus collapsable-header-state collapsed"></i>
    <i class="bi bi-dash collapsable-header-state expanded"></i>
  </div>
  <div class="d-none d-sm-inline-block">
    <span class="collapsable-header-state collapsed text-sans-serif text-small">voir plus</span>
    <span class="collapsable-header-state expanded text-sans-serif text-small">voir moins</span>
  </div>
</a>
