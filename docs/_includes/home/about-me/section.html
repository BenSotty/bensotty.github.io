<div id="{{ include.id }}" class="row g-3 align-items-center">
  <div class="col-12 col-md-4 col-xl-3 justify-content-center {% if include.icon %} d-none d-md-flex {% else %} d-flex {% endif %}">
    {% if include.imgPath %}
      <img
        class="round-section-picture rounded-circle border border-3 shadow"
        src="{{ include.imgPath }}"
        alt="{{ include.imgAlt }}"
      />
    {% else %}
      <div class="round-section-picture d-flex align-items-center justify-content-center rounded-circle border border-3 shadow p-4 bg-body-secondary">
        {% if include.icon %}
          <i class="bi {{ include.icon }} text-primary fs-1"></i>
        {% else %}
          <img
            class="d-inline-block"
            src="{{ include.iconPath }}"
            alt="{{ include.iconAlt }}"
            width="50px"
            style="width: 50px; height: auto;"
          />
        {% endif %}
      </div>
    {% endif %}
  </div>
  <div class="col-12 col-md-8 col-xl-9">
    {% if include.text_type == "expandable" %}
      <div class="expandable-text-list">
        {{ include.text | markdownify }}
      </div>
    {% else %}
      {{ include.text | markdownify }}
    {% endif %}
  </div>
</div>
