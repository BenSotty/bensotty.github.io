<div class="card shadow h-100">
  <div class="card-body d-flex flex-column justify-content-between">
    {% for review in include.reviews %}
      <div class="position-relative">
        <span class="text-bold text-sans-serif">{{ review.name }}</span>
        {% include home/reviews/review-stars.html stars=review.stars %}
        <span class="m-0 text-small text-sans-serif text-gray-600 position-absolute end-0 bottom-0">{{ review.date }}</span>
      </div>
    {% endfor %}
  </div>
</div>
