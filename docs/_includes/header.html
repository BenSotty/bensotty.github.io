<header class="fixed-top bg-primary">
  <div class="header-wrapper">
    <nav id="header-navbar" class="navbar navbar-expand-md" aria-label="Navigation principale">
      <div class="container-fluid">
        <a class="navbar-brand text-white d-flex align-items-center" href="/">
          {% include logo.html %}
        </a>
        <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          {% include svg-icons/burger-menu.svg %}
        </button>
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body justify-content-end">
            <ul class="navbar-nav">
              {% for item in page.sections %}
                {% assign sectionName = item[0] %}
                {% assign section = item[1] %}

                <li class="nav-item">
                  <a id="header-navbar-{{ section.id }}" class="nav-link {% if sectionName == 'booking' %} nav-booking-link {% endif %}" href="#{{ section.id }}">{{ section.title }}</a>
                </li>
                {% if forloop.last == false %}
                  <li class="nav-item py-md-1 col-12 col-md-auto">
                    <div class="vr d-none d-md-flex h-100 mx-0 mx-lg-2 text-white"></div>
                    <hr class="d-md-none my-1 text-gray-600">
                  </li>
                {% endif %}
              {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
