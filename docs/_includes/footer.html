<footer class="bd-footer py-4 py-md-5 bg-primary">
  <div class="container-md py-sm-4 py-md-5 px-sm-4 text-white">
    <div class="row align-items-center">
      <div class="col mb-3">
        {% include logo.html %}
        <ul class="list-unstyled small">
          <li class="mb-2">
            <a class="link-white d-flex flow-row align-items-center gap-2" href="mailto:{{ site.data.me.email }}">
              <i class="bi bi-envelope-at-fill text-white fs-4"></i>
              <span>{{ site.data.me.email }}</span>
            </a>
          </li>
          <li class="mb-2 d-flex flow-row align-items-center">
            <a class="link-white d-flex flow-row align-items-center gap-2" href="tel:{{ site.data.me.phone_international }}">
              <i class="bi bi-phone-fill text-white fs-4"></i>
              <span>{{ site.data.me.phone_display }}</span>
            </a>
          </li>
          <li class="mb-2">
            <div class= "d-flex flow-row align-items-center gap-3 text-white">
              <a class="link-white" href="{{ site.data.me.google }}" target="_blank">
                <i class="bi bi-google fs-4"></i>
              </a>
              <div class="vr text-white opacity-100 align-self-center"></div>
              <a class="link-white" href="{{ site.data.me.linkedin }}" target="_blank">
                <i class="bi bi-linkedin fs-4"></i>
              </a>
              <div class="vr text-white opacity-100 align-self-center"></div>
              <a class="link-white" href="{{ site.data.me.github }}" target="_blank">
                <i class="bi bi-github fs-4"></i>
              </a>
            </div>
          </li>
        </ul>
      </div>
      <div class="col mb-3 text-end">
        {% include booking-button.html class="btn-white btn-responsive" %}
      </div>
    </div>
  </div>
</footer>
